<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Soft architectural ground shadows -->
  <circle cx="52" cy="56" r="28" fill="#0F172A" fill-opacity="0.06"/>
  <circle cx="84" cy="60" r="22" fill="#0F172A" fill-opacity="0.06"/>
  <circle cx="68" cy="88" r="24" fill="#0F172A" fill-opacity="0.06"/>

  <!-- Architectural planter bed outline -->
  <rect x="14" y="18" width="100" height="92" rx="46" fill="#F1F5F9" fill-opacity="0.5" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Shrub 1 (Top-Left Primary) -->
  <circle cx="48" cy="52" r="26" fill="#CAD2C5" fill-opacity="0.85" stroke="#52796F" stroke-width="1.4"/>
  <circle cx="48" cy="52" r="15" fill="#A3B18A" fill-opacity="0.65" stroke="#52796F" stroke-width="0.9"/>
  <circle cx="48" cy="52" r="3" fill="#354F52"/>

  <!-- Shrub 2 (Top-Right Secondary) -->
  <circle cx="82" cy="56" r="21" fill="#B7C4B3" fill-opacity="0.85" stroke="#52796F" stroke-width="1.4"/>
  <circle cx="82" cy="56" r="11" fill="#84A98C" fill-opacity="0.6" stroke="#354F52" stroke-width="0.9"/>
  <circle cx="82" cy="56" r="2.5" fill="#354F52"/>

  <!-- Shrub 3 (Bottom Center) -->
  <circle cx="65" cy="84" r="23" fill="#A3B18A" fill-opacity="0.8" stroke="#354F52" stroke-width="1.4"/>
  <circle cx="65" cy="84" r="13" fill="#84A98C" fill-opacity="0.65" stroke="#354F52" stroke-width="0.9"/>
  <line x1="55" y1="84" x2="75" y2="84" stroke="#354F52" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="65" y1="74" x2="65" y2="94" stroke="#354F52" stroke-width="0.75" stroke-opacity="0.5"/>
  <circle cx="65" cy="84" r="3" fill="#354F52"/>

  <!-- Small accent foliage node -->
  <circle cx="38" cy="82" r="10" fill="#CAD2C5" fill-opacity="0.9" stroke="#52796F" stroke-width="1.1"/>
  <circle cx="38" cy="82" r="2" fill="#52796F"/>
</svg>
