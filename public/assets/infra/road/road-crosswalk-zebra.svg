<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 96" width="256" height="96" fill="none">
  <!-- Swiss grid alignment boundary lines -->
  <line x1="8" y1="8" x2="248" y2="8" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <line x1="8" y1="88" x2="248" y2="88" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- End alignment ticks -->
  <line x1="8" y1="4" x2="8" y2="12" stroke="#64748B" stroke-width="1"/>
  <line x1="248" y1="4" x2="248" y2="12" stroke="#64748B" stroke-width="1"/>
  <line x1="8" y1="84" x2="8" y2="92" stroke="#64748B" stroke-width="1"/>
  <line x1="248" y1="84" x2="248" y2="92" stroke="#64748B" stroke-width="1"/>

  <!-- Zebra crosswalk bars (6 architectural blocks) -->
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.25">
    <rect x="16" y="14" width="24" height="68" rx="1"/>
    <rect x="56" y="14" width="24" height="68" rx="1"/>
    <rect x="96" y="14" width="24" height="68" rx="1"/>
    <rect x="136" y="14" width="24" height="68" rx="1"/>
    <rect x="176" y="14" width="24" height="68" rx="1"/>
    <rect x="216" y="14" width="24" height="68" rx="1"/>
  </g>

  <!-- Subtle CAD center axis marks on each bar -->
  <g stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="2 3">
    <line x1="28" y1="20" x2="28" y2="76"/>
    <line x1="68" y1="20" x2="68" y2="76"/>
    <line x1="108" y1="20" x2="108" y2="76"/>
    <line x1="148" y1="20" x2="148" y2="76"/>
    <line x1="188" y1="20" x2="188" y2="76"/>
    <line x1="228" y1="20" x2="228" y2="76"/>
  </g>
</svg>
