    <!-- Frond Midribs -->
    <g stroke="#BBF7D0" stroke-width="0.7" stroke-opacity="0.75" stroke-linecap="round">
      <line x1="32" y1="32" x2="32" y2="6"/>
      <line x1="32" y1="32" x2="32" y2="58"/>
      <line x1="32" y1="32" x2="6" y2="32"/>
      <line x1="32" y1="32" x2="58" y2="32"/>
    </g>

    <!-- Central Crown & Coconut Cluster -->
    <circle cx="30" cy="30" r="2.6" fill="#78350F"/>
    <circle cx="34" cy="31" r="2.4" fill="#92400E"/>
    <circle cx="31.5" cy="34" r="2.5" fill="#78350F"/>
    <circle cx="32" cy="32" r="2" fill="#86EFAC"/>
