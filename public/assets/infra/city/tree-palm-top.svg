<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="tp-shadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="2.5" dy="3" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#tp-shadow)">
    <!-- Lower Shaded Palm Fronds -->
    <g fill="#14532D" stroke="#052E16" stroke-width="0.6">
      <path d="M32 32 C22 22, 12 14, 7 8 C15 11, 24 18, 32 32 Z"/>
      <path d="M32 32 C42 22, 52 14, 57 8 C49 11, 40 18, 32 32 Z"/>
      <path d="M32 32 C22 42, 12 50, 7 56 C15 53, 24 46, 32 32 Z"/>
      <path d="M32 32 C42 42, 52 50, 57 56 C49 53, 40 46, 32 32 Z"/>
    </g>

    <!-- Mid Emerald Palm Fronds -->
    <g fill="#16A34A" stroke="#14532D" stroke-width="0.6">
      <path d="M32 32 C27 19, 28 9, 32 3 C36 9, 37 19, 32 32 Z"/>
      <path d="M32 32 C27 45, 28 55, 32 61 C36 55, 37 45, 32 32 Z"/>
      <path d="M32 32 C19 27, 9 28, 3 32 C9 36, 19 37, 32 32 Z"/>
      <path d="M32 32 C45 27, 55 28, 61 32 C55 36, 45 37, 32 32 Z"/>
    </g>

