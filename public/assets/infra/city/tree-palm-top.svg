    <g fill="#4ADE80" stroke="#15803D" stroke-width="0.5">
      <path d="M32 32 C21 26, 13 21, 9 16 C16 18, 25 23, 32 32 Z"/>
      <path d="M32 32 C43 26, 51 21, 55 16 C48 18, 39 23, 32 32 Z"/>
