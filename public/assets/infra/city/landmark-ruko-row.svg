<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120" fill="none">
  <defs>
    <filter id="ruko-shadow" x="-10%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Front Paved Parking Strip -->
  <rect x="6" y="84" width="168" height="30" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <g stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.8">
    <line x1="34" y1="88" x2="34" y2="110"/>
    <line x1="62" y1="88" x2="62" y2="110"/>
    <line x1="90" y1="88" x2="90" y2="110"/>
    <line x1="118" y1="88" x2="118" y2="110"/>
    <line x1="146" y1="88" x2="146" y2="110"/>
  </g>

  <!-- 4-Unit Indonesian Ruko Row -->
  <g filter="url(#ruko-shadow)">
    <!-- Unit 1: Terracotta -->
    <rect x="10" y="10" width="38" height="72" rx="2" fill="#EA580C" stroke="#7C2D12" stroke-width="1.2"/>
    <line x1="29" y1="10" x2="29" y2="82" stroke="#FED7AA" stroke-width="1.4"/>
    <rect x="10" y="72" width="38" height="10" fill="#DC2626"/>
    <!-- Unit 2: Slate Blue -->
    <rect x="50" y="10" width="38" height="72" rx="2" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1.2"/>
    <line x1="69" y1="10" x2="69" y2="82" stroke="#BFDBFE" stroke-width="1.4"/>
    <rect x="50" y="72" width="38" height="10" fill="#2563EB"/>
    <!-- Unit 3: Warm Ochre -->
    <rect x="90" y="10" width="38" height="72" rx="2" fill="#D97706" stroke="#78350F" stroke-width="1.2"/>
    <line x1="109" y1="10" x2="109" y2="82" stroke="#FDE68A" stroke-width="1.4"/>
    <rect x="90" y="72" width="38" height="10" fill="#B45309"/>
    <!-- Unit 4: Emerald / Shop -->
    <rect x="130" y="10" width="40" height="72" rx="2" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>
    <line x1="150" y1="10" x2="150" y2="82" stroke="#99F6E4" stroke-width="1.4"/>
    <rect x="130" y="72" width="40" height="10" fill="#0F766E"/>
  </g>
</svg>
