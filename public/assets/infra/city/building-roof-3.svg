<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="br3-shadow" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="br3-concrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="br3-skylight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <g filter="url(#br3-shadow)">
    <!-- Concrete Parapet Wall -->
    <rect x="4" y="4" width="152" height="152" rx="4" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <!-- Inner Flat Roof Deck (Ruko / Mid-rise Commercial) -->
    <rect x="11" y="11" width="138" height="138" rx="2" fill="url(#br3-concrete)" stroke="#64748B" stroke-width="1"/>

    <!-- Expansion Joint Lines -->
    <line x1="11" y1="80" x2="149" y2="80" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="80" y1="11" x2="80" y2="149" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="4 3"/>

    <!-- Central Glass Skylight Atrium -->
    <rect x="42" y="42" width="76" height="76" rx="3" fill="url(#br3-skylight)" stroke="#0369A1" stroke-width="1.5"/>
    <!-- Skylight Mullion Grid -->
    <g stroke="#E0F2FE" stroke-width="1.2" stroke-opacity="0.8">
      <line x1="61" y1="42" x2="61" y2="118"/>
      <line x1="80" y1="42" x2="80" y2="118"/>
      <line x1="99" y1="42" x2="99" y2="118"/>
      <line x1="42" y1="61" x2="118" y2="61"/>
      <line x1="42" y1="80" x2="118" y2="80"/>
      <line x1="42" y1="99" x2="118" y2="99"/>
    </g>

    <!-- Twin Rooftop HVAC Chiller Units (Top) -->
    <rect x="20" y="16" width="38" height="18" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <circle cx="31" cy="25" r="5.5" fill="#334155"/>
    <circle cx="47" cy="25" r="5.5" fill="#334155"/>

    <rect x="102" y="16" width="38" height="18" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <circle cx="113" cy="25" r="5.5" fill="#334155"/>
    <circle cx="129" cy="25" r="5.5" fill="#334155"/>

    <!-- Indonesian Blue Toren Air (Water Tank) & Roof Access Hatch (Bottom) -->
    <circle cx="28" cy="134" r="10" fill="#0284C7" stroke="#075985" stroke-width="1.2"/>
    <circle cx="28" cy="134" r="4.5" fill="#7DD3FC"/>
    <rect x="122" y="124" width="20" height="18" rx="1.5" fill="#64748B" stroke="#334155" stroke-width="1"/>
    <line x1="125" y1="128" x2="139" y2="128" stroke="#CBD5E1" stroke-width="1"/>
  </g>
</svg>
