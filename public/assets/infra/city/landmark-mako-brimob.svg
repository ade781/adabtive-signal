<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <filter id="mako-shadow" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="mako-roof-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Parade Ground / Lapangan Apel -->
  <rect x="8" y="8" width="164" height="164" rx="6" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="20" y="92" width="140" height="68" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="1"/>
  <rect x="26" y="98" width="128" height="56" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Flagpole Circle -->
  <circle cx="90" cy="102" r="5" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <circle cx="90" cy="102" r="2" fill="#DC2626"/>

  <!-- Main Command Building (L-Shaped Javanese Limasan Roof) -->
  <g filter="url(#mako-shadow)">
    <rect x="18" y="16" width="144" height="58" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/>
    <polygon points="22,20 158,20 142,36 38,36" fill="#DC2626"/>
    <polygon points="22,70 158,70 142,54 38,54" fill="url(#mako-roof-main)"/>
    <polygon points="22,20 38,36 38,54 22,70" fill="#EF4444"/>
    <polygon points="158,20 142,36 142,54 158,70" fill="#991B1B"/>
    <rect x="38" y="36" width="104" height="18" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1"/>
    <!-- Entrance Portico -->
    <rect x="74" y="68" width="32" height="14" rx="2" fill="#334155" stroke="#0F172A" stroke-width="1"/>
  </g>

  <!-- Guard Post (Pos Jaga) near corner -->
  <g filter="url(#mako-shadow)">
    <rect x="134" y="138" width="26" height="22" rx="2" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
    <rect x="137" y="141" width="20" height="16" rx="1" fill="#B91C1C"/>
  </g>
</svg>
