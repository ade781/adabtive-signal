<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" width="180" height="150" fill="none">
  <defs>
    <filter id="pasar-shadow" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.26"/>
    </filter>
    <pattern id="pasar-corrugated" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0F172A" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="168" height="138" rx="4" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2"/>

  <!-- Market Hall Blocks (Los Pasar) -->
  <g filter="url(#pasar-shadow)">
    <!-- North Hall (Blue Zinc Roof) -->
    <rect x="14" y="14" width="152" height="44" rx="2" fill="#0284C7" stroke="#075985" stroke-width="1.3"/>
    <rect x="14" y="14" width="152" height="44" fill="url(#pasar-corrugated)"/>
    <line x1="14" y1="36" x2="166" y2="36" stroke="#E0F2FE" stroke-width="1.4"/>

    <!-- South-West Hall (Terracotta) -->
    <rect x="14" y="68" width="72" height="66" rx="2" fill="#C2410C" stroke="#7C2D12" stroke-width="1.3"/>
    <rect x="14" y="68" width="72" height="66" fill="url(#pasar-corrugated)"/>
    <line x1="50" y1="68" x2="50" y2="134" stroke="#FED7AA" stroke-width="1.2"/>

    <!-- South-East Hall (Emerald Canopy) -->
    <rect x="94" y="68" width="72" height="66" rx="2" fill="#0F766E" stroke="#134E4A" stroke-width="1.3"/>
    <rect x="94" y="68" width="72" height="66" fill="url(#pasar-corrugated)"/>
    <line x1="130" y1="68" x2="130" y2="134" stroke="#99F6E4" stroke-width="1.2"/>
  </g>
</svg>
