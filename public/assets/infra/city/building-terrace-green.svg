<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="btg-shadow" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.26"/>
    </filter>
    <linearGradient id="btg-lawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="55%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="btg-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <g filter="url(#btg-shadow)">
    <!-- Concrete Parapet -->
    <rect x="6" y="6" width="148" height="148" rx="6" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>

    <!-- Lush Tropical Rooftop Garden Bed -->
    <rect x="16" y="16" width="128" height="128" rx="4" fill="url(#btg-lawn)" stroke="#166534" stroke-width="1.2"/>

    <!-- Wooden Teak Pergola / Decking Walkways -->
    <rect x="16" y="72" width="128" height="16" fill="url(#btg-wood)" fill-opacity="0.85"/>
    <rect x="72" y="16" width="16" height="128" fill="url(#btg-wood)" fill-opacity="0.85"/>

    <!-- Central Penthouse Skylight Pavilion -->
    <rect x="44" y="44" width="72" height="72" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <rect x="52" y="52" width="56" height="56" rx="3" fill="#38BDF8" fill-opacity="0.7" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="80" y1="52" x2="80" y2="108" stroke="#E0F2FE" stroke-width="1.2"/>
    <line x1="52" y1="80" x2="108" y2="80" stroke="#E0F2FE" stroke-width="1.2"/>

    <!-- 4 Corner Tropical Canopy Shrubs with Depth -->
    <g>
      <circle cx="32" cy="32" r="12" fill="#0F172A" fill-opacity="0.2"/>
      <circle cx="30" cy="30" r="11" fill="#166534"/>
      <circle cx="28" cy="28" r="7" fill="#22C55E"/>
      <circle cx="27" cy="27" r="3.5" fill="#86EFAC"/>
    </g>
    <g>
      <circle cx="130" cy="32" r="12" fill="#0F172A" fill-opacity="0.2"/>
      <circle cx="128" cy="30" r="11" fill="#166534"/>
      <circle cx="126" cy="28" r="7" fill="#22C55E"/>
      <circle cx="125" cy="27" r="3.5" fill="#86EFAC"/>
    </g>
    <g>
      <circle cx="32" cy="130" r="12" fill="#0F172A" fill-opacity="0.2"/>
      <circle cx="30" cy="128" r="11" fill="#166534"/>
      <circle cx="28" cy="126" r="7" fill="#22C55E"/>
      <circle cx="27" cy="125" r="3.5" fill="#86EFAC"/>
    </g>
    <g>
      <circle cx="130" cy="130" r="12" fill="#0F172A" fill-opacity="0.2"/>
      <circle cx="128" cy="128" r="11" fill="#166534"/>
      <circle cx="126" cy="126" r="7" fill="#22C55E"/>
      <circle cx="125" cy="125" r="3.5" fill="#86EFAC"/>
    </g>
  </g>
</svg>
