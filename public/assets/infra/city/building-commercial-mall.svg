<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" fill="none">
  <defs>
    <filter id="bcm-shadow" x="-10%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bcm-deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="bcm-atrium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <g filter="url(#bcm-shadow)">
    <!-- Outer Mall Parapet -->
    <rect x="6" y="6" width="188" height="128" rx="6" fill="#94A3B8" stroke="#475569" stroke-width="1.6"/>
    <!-- Main Roof Deck -->
    <rect x="14" y="14" width="172" height="112" rx="4" fill="url(#bcm-deck)" stroke="#64748B" stroke-width="1.2"/>

    <!-- Perimeter Architectural Metal Cladding Ribs -->
    <g stroke="#CBD5E1" stroke-width="1">
      <line x1="20" y1="14" x2="20" y2="126"/>
      <line x1="180" y1="14" x2="180" y2="126"/>
    </g>

    <!-- Central Glass Atrium Skylight -->
    <rect x="54" y="32" width="92" height="76" rx="6" fill="url(#bcm-atrium)" stroke="#0369A1" stroke-width="1.5"/>
    <g stroke="#E0F2FE" stroke-width="1.3" stroke-opacity="0.8">
      <line x1="77" y1="32" x2="77" y2="108"/>
      <line x1="100" y1="32" x2="100" y2="108"/>
      <line x1="123" y1="32" x2="123" y2="108"/>
      <line x1="54" y1="57" x2="146" y2="57"/>
      <line x1="54" y1="83" x2="146" y2="83"/>
    </g>

    <!-- Left HVAC Chiller Bank -->
    <rect x="22" y="24" width="24" height="44" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <circle cx="34" cy="35" r="6" fill="#334155"/>
    <circle cx="34" cy="55" r="6" fill="#334155"/>

    <!-- Right HVAC Chiller Bank -->
    <rect x="154" y="24" width="24" height="44" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <circle cx="166" cy="35" r="6" fill="#334155"/>
    <circle cx="166" cy="55" r="6" fill="#334155"/>

    <!-- Landscaped Rooftop Planter Strips (Tropical Mall Terrace) -->
    <rect x="22" y="80" width="24" height="36" rx="3" fill="#15803D" stroke="#166534" stroke-width="1"/>
    <circle cx="34" cy="90" r="6" fill="#22C55E"/>
    <circle cx="34" cy="106" r="6" fill="#4ADE80"/>

    <rect x="154" y="80" width="24" height="36" rx="3" fill="#15803D" stroke="#166534" stroke-width="1"/>
    <circle cx="166" cy="90" r="6" fill="#4ADE80"/>
    <circle cx="166" cy="106" r="6" fill="#22C55E"/>

    <!-- Front Drop-Off Entrance Canopy (South) -->
    <rect x="74" y="122" width="52" height="14" rx="2" fill="#334155" stroke="#0F172A" stroke-width="1.1"/>
    <rect x="80" y="124" width="40" height="6" rx="1" fill="#38BDF8" fill-opacity="0.7"/>
  </g>
</svg>
