<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <filter id="kampus-shadow" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- Campus Ground -->
  <rect x="8" y="8" width="164" height="164" rx="6" fill="#D1FAE5" stroke="#64748B" stroke-width="1.3"/>
  <!-- Inner Courtyard Lawn -->
  <rect x="52" y="56" width="76" height="96" rx="4" fill="#86EFAC" stroke="#22C55E" stroke-width="1"/>
  <circle cx="90" cy="104" r="14" fill="#4ADE80" stroke="#15803D" stroke-width="1"/>

  <!-- U-Shaped Academic Building -->
  <g filter="url(#kampus-shadow)">
    <!-- North Wing -->
    <rect x="18" y="18" width="144" height="36" rx="2" fill="#B45309" stroke="#78350F" stroke-width="1.4"/>
    <line x1="18" y1="36" x2="162" y2="36" stroke="#FDE68A" stroke-width="1.5"/>
    <!-- West Wing -->
    <rect x="18" y="54" width="32" height="106" rx="2" fill="#D97706" stroke="#78350F" stroke-width="1.4"/>
    <line x1="34" y1="54" x2="34" y2="160" stroke="#FDE68A" stroke-width="1.5"/>
    <!-- East Wing -->
    <rect x="130" y="54" width="32" height="106" rx="2" fill="#D97706" stroke="#78350F" stroke-width="1.4"/>
    <line x1="146" y1="54" x2="146" y2="160" stroke="#FDE68A" stroke-width="1.5"/>
  </g>
</svg>
