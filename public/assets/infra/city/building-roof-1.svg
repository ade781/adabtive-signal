<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="br1-shadow" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <!-- Sun from Top-Left: Top & Left slopes brighter, Bottom & Right slopes deeper terracotta -->
    <linearGradient id="br1-north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="br1-west" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="br1-east" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="br1-south" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <pattern id="br1-tiles" width="12" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#431407" stroke-opacity="0.18" stroke-width="0.7"/>
      <line x1="6" y1="0" x2="6" y2="5" stroke="#431407" stroke-opacity="0.14" stroke-width="0.6"/>
      <line x1="0" y1="5" x2="0" y2="10" stroke="#431407" stroke-opacity="0.14" stroke-width="0.6"/>
    </pattern>
  </defs>

  <g filter="url(#br1-shadow)">
    <!-- Eaves / Concrete Plinth -->
    <rect x="8" y="8" width="144" height="144" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>

    <!-- Indonesian Limasan / Hipped Terracotta Genteng Roof Slopes -->
    <!-- West Slope (Sunlit) -->
    <polygon points="12,12 48,54 48,106 12,148" fill="url(#br1-west)"/>
    <!-- North Slope -->
    <polygon points="12,12 148,12 112,54 48,54" fill="url(#br1-north)"/>
    <!-- East Slope (Shaded) -->
    <polygon points="148,12 148,148 112,106 112,54" fill="url(#br1-east)"/>
    <!-- South Slope (Shaded) -->
    <polygon points="12,148 48,106 112,106 148,148" fill="url(#br1-south)"/>

    <!-- Tile Texture Overlay -->
    <rect x="12" y="12" width="136" height="136" fill="url(#br1-tiles)"/>

    <!-- Center Flat/Raised Crown Deck -->
    <rect x="48" y="54" width="64" height="52" fill="#C2410C" stroke="#7C2D12" stroke-width="1"/>
    <rect x="48" y="54" width="64" height="52" fill="url(#br1-tiles)"/>

    <!-- Ridge Caps (Bubungan Genteng) -->
    <g stroke="#FED7AA" stroke-opacity="0.65" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="12" x2="48" y2="54"/>
      <line x1="148" y1="12" x2="112" y2="54"/>
      <line x1="12" y1="148" x2="48" y2="106"/>
      <line x1="148" y1="148" x2="112" y2="106"/>
      <line x1="48" y1="80" x2="112" y2="80"/>
    </g>
    <g stroke="#431407" stroke-width="1" stroke-linecap="round">
      <line x1="12" y1="12" x2="48" y2="54"/>
      <line x1="148" y1="12" x2="112" y2="54"/>
      <line x1="12" y1="148" x2="48" y2="106"/>
      <line x1="148" y1="148" x2="112" y2="106"/>
      <line x1="48" y1="80" x2="112" y2="80"/>
    </g>

    <!-- Small Concrete Utility Ledge with Indonesian Blue Water Tank (Toren Air) & AC Unit -->
    <rect x="114" y="114" width="30" height="30" rx="2" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <circle cx="125" cy="126" r="7" fill="#0284C7" stroke="#0369A1" stroke-width="1"/>
    <circle cx="125" cy="126" r="3.5" fill="#38BDF8"/>
    <rect x="134" y="122" width="7" height="10" rx="1" fill="#F8FAFC" stroke="#475569" stroke-width="0.8"/>
    <circle cx="137.5" cy="127" r="2.2" fill="#334155"/>
  </g>
</svg>
