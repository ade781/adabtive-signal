<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <filter id="stadion-shadow" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Stadium Plaza -->
  <rect x="8" y="8" width="164" height="164" rx="10" fill="#CBD5E1" stroke="#64748B" stroke-width="1.4"/>

  <!-- Running Track & Pitch -->
  <rect x="20" y="20" width="140" height="140" rx="48" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.4"/>
  <rect x="34" y="34" width="112" height="112" rx="34" fill="#16A34A" stroke="#F8FAFC" stroke-width="1.2"/>
  <line x1="90" y1="34" x2="90" y2="146" stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.85"/>
  <circle cx="90" cy="90" r="16" fill="none" stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.85"/>

  <!-- Grandstand Roof Canopy (West & North) -->
  <g filter="url(#stadion-shadow)">
    <path d="M 16 140 L 16 40 Q 16 16 40 16 L 140 16 L 140 32 L 44 32 Q 32 32 32 44 L 32 140 Z" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
