<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none">
  <!-- Terminal Giwangan Top-Down Campus -->
  <rect x="4" y="4" width="172" height="112" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Bus apron asphalt -->
  <rect x="12" y="14" width="156" height="92" rx="5" fill="#475569"/>
  <!-- Main terminal concourse canopy (Joglo-inspired stepped roof) -->
  <rect x="22" y="22" width="136" height="32" rx="4" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
  <rect x="30" y="26" width="120" height="24" rx="2" fill="#EF4444"/>
  <rect x="64" y="28" width="52" height="20" rx="2" fill="#B91C1C"/>
  <!-- Bus bay diagonal markings -->
  <g stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="28" y1="60" x2="28" y2="96"/>
    <line x1="52" y1="60" x2="52" y2="96"/>
    <line x1="76" y1="60" x2="76" y2="96"/>
    <line x1="100" y1="60" x2="100" y2="96"/>
    <line x1="124" y1="60" x2="124" y2="96"/>
    <line x1="148" y1="60" x2="148" y2="96"/>
  </g>
  <!-- Parked AKAP buses -->
  <rect x="33" y="64" width="14" height="28" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1"/>
  <rect x="57" y="66" width="14" height="26" rx="3" fill="#38BDF8" stroke="#0F172A" stroke-width="1"/>
  <rect x="105" y="64" width="14" height="28" rx="3" fill="#F59E0B" stroke="#0F172A" stroke-width="1"/>
  <rect x="129" y="66" width="14" height="26" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>
  <!-- Label badge -->
  <text x="90" y="42" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">TERMINAL GIWANGAN</text>
</svg>
