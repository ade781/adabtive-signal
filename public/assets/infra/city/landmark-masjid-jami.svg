<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="masjid-shadow" x="-10%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="masjid-dome" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065F46"/>
    </radialGradient>
  </defs>

  <!-- Marble Courtyard / Pelataran -->
  <rect x="8" y="8" width="144" height="144" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="14" y="14" width="132" height="132" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Main Prayer Hall Roof -->
  <g filter="url(#masjid-shadow)">
    <rect x="24" y="24" width="112" height="112" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
    <rect x="30" y="30" width="100" height="100" rx="4" fill="#10B981" fill-opacity="0.14" stroke="#059669" stroke-width="1"/>

    <!-- 4 Corner Minaret Caps -->
    <circle cx="32" cy="32" r="8" fill="#047857" stroke="#ECFDF5" stroke-width="1.2"/>
    <circle cx="128" cy="32" r="8" fill="#047857" stroke="#ECFDF5" stroke-width="1.2"/>
    <circle cx="32" cy="128" r="8" fill="#047857" stroke="#ECFDF5" stroke-width="1.2"/>
    <circle cx="128" cy="128" r="8" fill="#047857" stroke="#ECFDF5" stroke-width="1.2"/>

    <!-- Central Dome (Kubah) -->
    <circle cx="80" cy="80" r="34" fill="url(#masjid-dome)" stroke="#064E3B" stroke-width="1.8"/>
    <circle cx="80" cy="80" r="22" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="80" cy="80" r="6" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  </g>
</svg>
