<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <radialGradient id="ta1-outer" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="65%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <radialGradient id="ta1-mid" cx="38%" cy="36%" r="58%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="70%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#166534"/>
