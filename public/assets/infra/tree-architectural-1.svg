  <!-- Outer Organic Tropical Canopy (Trembesi / Angsana) -->
  <path d="M64 18 C82 18 98 28 105 44 C112 60 107 82 94 95 C81 108 58 111 41 101 C24 91 16 70 21 50 C26 30 44 18 64 18 Z" fill="url(#ta1-outer)" stroke="#052E16" stroke-width="1.2"/>

  <!-- Mid Foliage Lobes -->
  <path d="M62 27 C76 26 91 35 95 49 C99 63 93 80 80 89 C67 98 48 96 38 85 C28 74 28 55 36 42 C43 31 52 28 62 27 Z" fill="url(#ta1-mid)" fill-opacity="0.92"/>

  <!-- Sunlit Upper Crown Clusters -->
  <circle cx="52" cy="48" r="16" fill="#4ADE80" fill-opacity="0.8"/>
  <circle cx="72" cy="54" r="14" fill="#22C55E" fill-opacity="0.85"/>
  <circle cx="58" cy="70" r="15" fill="#16A34A" fill-opacity="0.85"/>
  <circle cx="50" cy="46" r="8" fill="#86EFAC" fill-opacity="0.75"/>

  <!-- Subtle Inner Branch Hints -->
  <g stroke="#14532D" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round">
    <line x1="64" y1="64" x2="48" y2="44"/>
    <line x1="64" y1="64" x2="82" y2="50"/>
    <line x1="64" y1="64" x2="54" y2="84"/>
