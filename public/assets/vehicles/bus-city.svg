<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 240" width="62" height="240" fill="none">
  <defs>
    <filter id="bc-shadow" x="-16%" y="-6%" width="132%" height="114%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <linearGradient id="bc-windshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="bc-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="20%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="80%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bc-roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="12%" stop-color="#F8FAFC"/>
      <stop offset="88%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <g filter="url(#bc-shadow)">
    <!-- Wheels -->
    <g fill="#0F172A">
      <rect x="4.5" y="28" width="4.5" height="19" rx="1.5"/>
      <rect x="53" y="28" width="4.5" height="19" rx="1.5"/>
      <rect x="4.5" y="180" width="4.5" height="22" rx="1.5"/>
      <rect x="53" y="180" width="4.5" height="22" rx="1.5"/>
    </g>

    <!-- Extended Bus Mirrors -->
    <g stroke="#020617" stroke-width="1.1">
      <path d="M7.5 14 L2 11.5 L2 19.5 L7.5 18 Z" fill="#1E3A8A"/>
      <path d="M54.5 14 L60 11.5 L60 19.5 L54.5 18 Z" fill="#1E3A8A"/>
    </g>

    <!-- Main Bus Shell (TransJakarta Royal Blue Base) -->
    <rect x="7" y="5" width="48" height="230" rx="9" fill="url(#bc-shell)" stroke="#020617" stroke-width="1.4"/>

    <!-- Crisp Headlights -->
    <rect x="10.5" y="6" width="8.5" height="3.2" rx="1.5" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8"/>
    <rect x="43" y="6" width="8.5" height="3.2" rx="1.5" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8"/>

    <!-- Panoramic Windshield -->
    <path d="M10 11 Q31 7 52 11 L50 26 Q31 23 12 26 Z" fill="url(#bc-windshield)" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Glass Reflection & Twin Wipers -->
    <path d="M15 13 Q31 10 47 13" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="17" y1="12.5" x2="29" y2="17" stroke="#64748B" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="33" y1="12.5" x2="45" y2="17" stroke="#64748B" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Destination LED Display Bar -->
    <rect x="18" y="26.2" width="26" height="3.8" rx="1" fill="#020617"/>
    <line x1="21" y1="28.1" x2="41" y2="28.1" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="2.2 1.4"/>

    <!-- Architectural Light Roof Deck -->
    <rect x="10" y="33" width="42" height="190" rx="4" fill="url(#bc-roof)" stroke="#1E293B" stroke-width="1.1"/>

    <!-- TransJakarta Sky-Blue & Cyan Livery Stripes -->
    <rect x="11" y="34" width="3.2" height="188" rx="1" fill="#0284C7"/>
    <rect x="47.8" y="34" width="3.2" height="188" rx="1" fill="#0284C7"/>

    <!-- Front Emergency Roof Hatch -->
    <rect x="22" y="38" width="18" height="12" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <line x1="25" y1="44" x2="37" y2="44" stroke="#94A3B8" stroke-width="1"/>

    <!-- Roof AC Unit 1 (Front) -->
    <g>
      <rect x="15.5" y="55.5" width="31" height="37" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/>
      <rect x="18.5" y="58.5" width="25" height="3" rx="1" fill="#0284C7"/>
      <circle cx="24.5" cy="74" r="6.2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <path d="M20.5 74 L28.5 74 M24.5 70 L24.5 78" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="24.5" cy="74" r="2" fill="#94A3B8"/>
      <circle cx="37.5" cy="74" r="6.2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <path d="M33.5 74 L41.5 74 M37.5 70 L37.5 78" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="37.5" cy="74" r="2" fill="#94A3B8"/>
      <line x1="18.5" y1="86.5" x2="43.5" y2="86.5" stroke="#64748B" stroke-width="1"/>
    </g>

    <!-- Roof Panel Seam -->
    <line x1="14" y1="101" x2="48" y2="101" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Roof AC Unit 2 (Mid/Rear) -->
    <g>
      <rect x="15.5" y="109.5" width="31" height="41" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/>
      <rect x="18.5" y="112.5" width="25" height="3" rx="1" fill="#0284C7"/>
      <circle cx="24.5" cy="130" r="6.5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <path d="M20.5 130 L28.5 130 M24.5 126 L24.5 134" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="24.5" cy="130" r="2.2" fill="#94A3B8"/>
      <circle cx="37.5" cy="130" r="6.5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <path d="M33.5 130 L41.5 130 M37.5 126 L37.5 134" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="37.5" cy="130" r="2.2" fill="#94A3B8"/>
      <line x1="18.5" y1="144.5" x2="43.5" y2="144.5" stroke="#64748B" stroke-width="1"/>
    </g>

    <!-- Roof Panel Seam -->
    <line x1="14" y1="160" x2="48" y2="160" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Rear HVAC / Engine Cooling Louvers -->
    <g>
      <rect x="18" y="168" width="26" height="26" rx="2.5" fill="#E2E8F0" stroke="#64748B" stroke-width="1.1"/>
      <line x1="21" y1="173.5" x2="41" y2="173.5" stroke="#475569" stroke-width="1.2"/>
      <line x1="21" y1="178.5" x2="41" y2="178.5" stroke="#475569" stroke-width="1.2"/>
      <line x1="21" y1="183.5" x2="41" y2="183.5" stroke="#475569" stroke-width="1.2"/>
      <rect x="25" y="188" width="12" height="2.5" rx="1" fill="#0284C7"/>
    </g>

    <!-- Rear Emergency Roof Hatch -->
    <rect x="22" y="202" width="18" height="12" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <line x1="25" y1="208" x2="37" y2="208" stroke="#94A3B8" stroke-width="1"/>

    <!-- Rear Window & Taillights -->
    <path d="M13 226 L49 226 L47 231 L15 231 Z" fill="#0F172A"/>
    <rect x="10" y="231.2" width="7.5" height="2.8" rx="1" fill="#EF4444"/>
    <rect x="44.5" y="231.2" width="7.5" height="2.8" rx="1" fill="#EF4444"/>
    <rect x="18.5" y="231.6" width="3" height="2" rx="0.5" fill="#F59E0B"/>
    <rect x="40.5" y="231.6" width="3" height="2" rx="0.5" fill="#F59E0B"/>
  </g>
</svg>
