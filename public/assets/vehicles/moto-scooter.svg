<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 80" width="32" height="80" fill="none">
  <defs>
    <filter id="ms-shadow" x="-30%" y="-12%" width="160%" height="130%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="ms-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="ms-helmet" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <g filter="url(#ms-shadow)">
    <!-- Front & Rear Tires -->
    <rect x="13.8" y="5" width="4.4" height="13" rx="2.2" fill="#0F172A"/>
    <rect x="13.8" y="62" width="4.4" height="13" rx="2.2" fill="#0F172A"/>

    <!-- Front Fairing (Vario/Beat Matic Style) -->
    <path d="M11 13 C11 10, 21 10, 21 13 L22.5 25 C22.5 28, 9.5 28, 9.5 25 Z" fill="url(#ms-body)" stroke="#0F172A" stroke-width="1"/>
    <!-- Dual LED Headlight -->
    <path d="M11.8 11.4 L15.2 10.6 L15.2 12.8 L12.2 13 Z" fill="#FEF9C3" stroke="#0F172A" stroke-width="0.5"/>
    <path d="M20.2 11.4 L16.8 10.6 L16.8 12.8 L19.8 13 Z" fill="#FEF9C3" stroke="#0F172A" stroke-width="0.5"/>
    <!-- Center Trim -->
    <rect x="15.2" y="14" width="1.6" height="8" rx="0.8" fill="#0F172A" fill-opacity="0.45"/>

    <!-- Mirrors -->
    <line x1="9" y1="19.5" x2="6.2" y2="16.5" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
    <line x1="23" y1="19.5" x2="25.8" y2="16.5" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="5.4" cy="15.8" rx="2" ry="1.3" fill="#475569" stroke="#0F172A" stroke-width="0.7"/>
    <ellipse cx="26.6" cy="15.8" rx="2" ry="1.3" fill="#475569" stroke="#0F172A" stroke-width="0.7"/>

    <!-- Scooter Handlebars -->
    <path d="M7 21.5 L12 19.3 L20 19.3 L25 21.5" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="6" y="20.2" width="3.8" height="2.4" rx="1.2" fill="#0F172A"/>
    <rect x="22.2" y="20.2" width="3.8" height="2.4" rx="1.2" fill="#0F172A"/>

    <!-- Step-Through Floorboard -->
    <rect x="10.2" y="25.5" width="11.6" height="14.5" rx="2" fill="#334155" stroke="#0F172A" stroke-width="0.9"/>
    <line x1="13" y1="28" x2="13" y2="37.5" stroke="#64748B" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="16" y2="37.5" stroke="#64748B" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="19" y1="28" x2="19" y2="37.5" stroke="#64748B" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Wide Scooter Rear Body & Seat + Exhaust -->
    <rect x="20.8" y="48" width="2" height="14" rx="1" fill="#64748B" stroke="#0F172A" stroke-width="0.6"/>
    <path d="M9.5 40 C9.5 37, 22.5 37, 22.5 40 L21.5 63.5 C21.5 67, 10.5 67, 10.5 63.5 Z" fill="url(#ms-body)" stroke="#0F172A" stroke-width="1"/>
    <rect x="11.6" y="42" width="8.8" height="18.5" rx="3.5" fill="#1E293B" stroke="#0F172A" stroke-width="0.8"/>

    <!-- Taillight -->
    <rect x="12.5" y="64.5" width="7" height="2.2" rx="0.9" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.5"/>
    <rect x="14" y="65" width="4" height="1" rx="0.4" fill="#FCA5A5"/>

    <!-- Rider Arms -->
    <path d="M10.8 36 L8 22" stroke="#475569" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M21.2 36 L24 22" stroke="#475569" stroke-width="3.1" stroke-linecap="round"/>
    <circle cx="7.8" cy="21.4" r="1.5" fill="#0F172A"/>
    <circle cx="24.2" cy="21.4" r="1.5" fill="#0F172A"/>

    <!-- Rider Torso (Light Casual Commuter Shirt/Jacket) -->
    <rect x="9.4" y="34.5" width="13.2" height="11.5" rx="5" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>
    <line x1="16" y1="35" x2="16" y2="45.5" stroke="#94A3B8" stroke-width="0.8"/>

    <!-- Rider Helmet (Matte Charcoal) -->
    <circle cx="16" cy="39" r="5.3" fill="url(#ms-helmet)" stroke="#0F172A" stroke-width="1.1"/>
    <path d="M11.8 36 C13.2 34, 18.8 34, 20.2 36 L19.2 37.5 C17.8 36.4, 14.2 36.4, 12.8 37.5 Z" fill="#020617"/>
    <path d="M13 35.5 C14.5 34.7, 17.5 34.7, 19 35.5" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.6"/>
    <rect x="15.3" y="38.5" width="1.4" height="4.8" rx="0.7" fill="#14B8A6"/>
  </g>
</svg>
