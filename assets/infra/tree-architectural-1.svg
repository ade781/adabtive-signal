<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Soft architectural ground shadow -->
  <circle cx="68" cy="68" r="46" fill="#0F172A" fill-opacity="0.06"/>

  <!-- Planter / tree pit ring -->
  <circle cx="64" cy="64" r="48" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Outer canopy (muted sage green) -->
  <circle cx="64" cy="64" r="42" fill="#CAD2C5" fill-opacity="0.75" stroke="#52796F" stroke-width="1.5"/>

  <!-- Mid canopy architectural lobes -->
  <path d="M64 26 C81 26 95 36 99 52 C103 68 96 86 82 95 C68 104 49 101 38 90 C27 79 25 60 33 45 C40 32 52 26 64 26 Z" fill="#A3B18A" fill-opacity="0.65" stroke="#52796F" stroke-width="1"/>

  <!-- Inner crown -->
  <circle cx="64" cy="64" r="22" fill="#84A98C" fill-opacity="0.7" stroke="#354F52" stroke-width="1"/>

  <!-- Architectural branch crosshairs (CAD plan style) -->
  <line x1="64" y1="36" x2="64" y2="92" stroke="#354F52" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="36" y1="64" x2="92" y2="64" stroke="#354F52" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="45" y1="45" x2="83" y2="83" stroke="#354F52" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="83" y1="45" x2="45" y2="83" stroke="#354F52" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Trunk center point -->
  <circle cx="64" cy="64" r="4.5" fill="#52796F" stroke="#1E293B" stroke-width="1.25"/>
</svg>
