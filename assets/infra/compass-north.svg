<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Swiss precision ring -->
  <circle cx="60" cy="60" r="46" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="60" cy="60" r="38" stroke="#1E293B" stroke-width="1.25"/>

  <!-- Cardinal tick marks -->
  <line x1="60" y1="10" x2="60" y2="18" stroke="#1E293B" stroke-width="1.75"/>
  <line x1="60" y1="102" x2="60" y2="110" stroke="#64748B" stroke-width="1.25"/>
  <line x1="10" y1="60" x2="18" y2="60" stroke="#64748B" stroke-width="1.25"/>
  <line x1="102" y1="60" x2="110" y2="60" stroke="#64748B" stroke-width="1.25"/>

  <!-- Intercardinal fine ticks -->
  <line x1="27.5" y1="27.5" x2="31.5" y2="31.5" stroke="#94A3B8" stroke-width="1"/>
  <line x1="92.5" y1="27.5" x2="88.5" y2="31.5" stroke="#94A3B8" stroke-width="1"/>
  <line x1="27.5" y1="92.5" x2="31.5" y2="88.5" stroke="#94A3B8" stroke-width="1"/>
  <line x1="92.5" y1="92.5" x2="88.5" y2="88.5" stroke="#94A3B8" stroke-width="1"/>

  <!-- Minimalist architectural north needle (split dark/light) -->
  <polygon points="60,24 69,66 60,59" fill="#0F172A"/>
  <polygon points="60,24 51,66 60,59" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.25" stroke-linejoin="round"/>

  <!-- South tail -->
  <line x1="60" y1="59" x2="60" y2="92" stroke="#64748B" stroke-width="1.25"/>
  <circle cx="60" cy="60" r="3" fill="#EF4444" stroke="#0F172A" stroke-width="1"/>

  <!-- Swiss "N" glyph (geometric vector path for font-independent crispness) -->
  <path d="M56.5 8.5 V2.5 L63.5 8.5 V2.5" stroke="#0F172A" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Architectural scale bar at bottom -->
  <line x1="36" y1="115" x2="84" y2="115" stroke="#334155" stroke-width="1.25"/>
  <line x1="36" y1="112" x2="36" y2="118" stroke="#334155" stroke-width="1.25"/>
  <line x1="60" y1="113" x2="60" y2="117" stroke="#64748B" stroke-width="1"/>
  <line x1="84" y1="112" x2="84" y2="118" stroke="#334155" stroke-width="1.25"/>
  <rect x="36" y="114" width="24" height="2" fill="#0F172A"/>
</svg>
