<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 80" width="32" height="80" fill="none">
  <defs>
    <filter id="shadow-scooter" x="-25%" y="-10%" width="150%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#shadow-scooter)">
    <!-- Front & Rear Tires -->
    <rect x="14" y="6" width="4" height="12" rx="2" fill="#1E293B"/>
    <rect x="14" y="62" width="4" height="12" rx="2" fill="#1E293B"/>

    <!-- Front Fairing / Apron -->
    <path d="M11.5 13 C11.5 10.5, 20.5 10.5, 20.5 13 L22 25 C22 27.5, 10 27.5, 10 25 Z" fill="#475569" stroke="#1E293B" stroke-width="1.1"/>
    <!-- Headlight -->
    <rect x="13.5" y="10.8" width="5" height="2.4" rx="1.2" fill="#FEF08A" stroke="#1E293B" stroke-width="0.8"/>
    <!-- Coral Accent Strip -->
    <rect x="15" y="14.5" width="2" height="8" rx="1" fill="#F43F5E"/>

    <!-- Mirrors -->
    <line x1="9" y1="20" x2="6.5" y2="17" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
    <line x1="23" y1="20" x2="25.5" y2="17" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
    <circle cx="5.8" cy="16.2" r="1.6" fill="#CBD5E1" stroke="#1E293B" stroke-width="0.9"/>
    <circle cx="26.2" cy="16.2" r="1.6" fill="#CBD5E1" stroke="#1E293B" stroke-width="0.9"/>

    <!-- Scooter Handlebars -->
    <path d="M7.5 21.5 L12 19.5 L20 19.5 L24.5 21.5" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="6.5" y="20.2" width="3.5" height="2.4" rx="1.2" fill="#0F172A"/>
    <rect x="22" y="20.2" width="3.5" height="2.4" rx="1.2" fill="#0F172A"/>

    <!-- Step-Through Floorboard -->
    <rect x="10.5" y="25" width="11" height="15" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1"/>
    <line x1="13" y1="28" x2="13" y2="37" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="16" y2="37" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="19" y1="28" x2="19" y2="37" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Wide Scooter Rear Body & Seat -->
    <path d="M9.5 40 C9.5 37, 22.5 37, 22.5 40 L21.5 63 C21.5 66.5, 10.5 66.5, 10.5 63 Z" fill="#475569" stroke="#1E293B" stroke-width="1.1"/>
    <rect x="11.8" y="42" width="8.4" height="18" rx="3.5" fill="#334155" stroke="#1E293B" stroke-width="0.9"/>
    <!-- Coral Rear Trim & Taillight -->
    <path d="M12.5 62.5 L19.5 62.5" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="13" y="64.2" width="6" height="2" rx="1" fill="#EF4444"/>

    <!-- Rider Arms -->
    <path d="M11 36 L8.5 22" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <path d="M21 36 L23.5 22" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="8.2" cy="21.5" r="1.4" fill="#1E293B"/>
    <circle cx="23.8" cy="21.5" r="1.4" fill="#1E293B"/>

    <!-- Rider Torso -->
    <rect x="9.5" y="35" width="13" height="11" rx="5" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.1"/>

    <!-- Rider Helmet (Slate & Coral) -->
    <circle cx="16" cy="39.5" r="5.2" fill="#F43F5E" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M12 36.8 C13.4 35, 18.6 35, 20 36.8 L19 38.1 C17.6 37.2, 14.4 37.2, 13 38.1 Z" fill="#1E293B"/>
    <rect x="15.3" y="38.8" width="1.4" height="5" rx="0.7" fill="#F8FAFC"/>
  </g>
</svg>
