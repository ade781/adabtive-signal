<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 250" width="64" height="250" fill="none">
  <defs>
    <linearGradient id="th-windshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="th-cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="20%" stop-color="#475569" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="th-trailer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="10%" stop-color="#F1F5F9" />
      <stop offset="90%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Tractor & Trailer Wheels -->
  <g id="wheels" fill="#0F172A">
    <!-- Steer axle -->
    <rect x="6" y="16" width="5" height="16" rx="2" />
    <rect x="53" y="16" width="5" height="16" rx="2" />
    <!-- Tractor tandem drive axles -->
    <rect x="5" y="53" width="5" height="14" rx="1.5" />
    <rect x="54" y="53" width="5" height="14" rx="1.5" />
    <!-- Trailer tandem axles -->
    <rect x="4" y="198" width="5" height="15" rx="1.5" />
    <rect x="55" y="198" width="5" height="15" rx="1.5" />
    <rect x="4" y="217" width="5" height="15" rx="1.5" />
    <rect x="55" y="217" width="5" height="15" rx="1.5" />
  </g>

  <!-- Side Mirrors -->
  <g id="mirrors" stroke="#0F172A" stroke-width="1.2">
    <path d="M9 24 L3 22 L3 30 L9 28 Z" fill="#334155" />
    <path d="M55 24 L61 22 L61 30 L55 28 Z" fill="#334155" />
  </g>

  <!-- Fifth-Wheel / Articulation Coupling -->
  <rect x="17" y="66" width="30" height="11" fill="#1E293B" stroke="#0F172A" stroke-width="1.2" />
  <circle cx="32" cy="71" r="4" fill="#334155" stroke="#64748B" stroke-width="1" />
  <line x1="21" y1="68" x2="21" y2="75" stroke="#F97316" stroke-width="1.2" />
  <line x1="43" y1="68" x2="43" y2="75" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Tractor Cab -->
  <g id="tractor">
    <!-- Heavy Front Bumper -->
    <rect x="10" y="4" width="44" height="6" rx="2.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.3" />
    <rect x="24" y="5.2" width="16" height="2" rx="1" fill="#F97316" />
    <!-- Cab Body -->
    <rect x="9" y="7" width="46" height="61" rx="6" fill="url(#th-cab)" stroke="#0F172A" stroke-width="1.5" />
    <!-- Headlights -->
    <rect x="12" y="7.5" width="8" height="3" rx="1" fill="#FEF08A" />
    <rect x="44" y="7.5" width="8" height="3" rx="1" fill="#FEF08A" />
    <!-- Hood Grille & Louvers -->
    <rect x="20" y="11" width="24" height="10" rx="2" fill="#334155" stroke="#1E293B" stroke-width="1" />
    <line x1="23" y1="14" x2="41" y2="14" stroke="#94A3B8" stroke-width="1" />
    <line x1="23" y1="17" x2="41" y2="17" stroke="#94A3B8" stroke-width="1" />
    <!-- Split Windshield -->
    <path d="M12 24 L31 22 L31 32 L14 33 Z" fill="url(#th-windshield)" stroke="#0F172A" stroke-width="1.1" />
    <path d="M52 24 L33 22 L33 32 L50 33 Z" fill="url(#th-windshield)" stroke="#0F172A" stroke-width="1.1" />
    <!-- Sleeper Cab Roof & Safety Orange Stripe -->
    <rect x="13" y="36" width="38" height="28" rx="3" fill="#64748B" stroke="#334155" stroke-width="1.1" />
    <rect x="28" y="36" width="8" height="28" fill="#F97316" />
    <!-- Twin Exhaust Stacks -->
    <circle cx="11.5" cy="61" r="2.3" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.1" />
    <circle cx="52.5" cy="61" r="2.3" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.1" />
    <!-- Amber Clearance Markers -->
    <circle cx="19" cy="35" r="1.1" fill="#F97316" />
    <circle cx="32" cy="34.5" r="1.1" fill="#F97316" />
    <circle cx="45" cy="35" r="1.1" fill="#F97316" />
  </g>

  <!-- Heavy Semi-Trailer -->
  <g id="trailer">
    <rect x="6" y="75" width="52" height="169" rx="3" fill="url(#th-trailer)" stroke="#1E293B" stroke-width="1.5" />
    <!-- Front Reefer / Aero Bulkhead -->
    <rect x="17" y="75" width="30" height="8" rx="1.5" fill="#334155" stroke="#0F172A" stroke-width="1.1" />
    <line x1="22" y1="79" x2="42" y2="79" stroke="#F97316" stroke-width="1.5" />

    <!-- Inner Roof Frame -->
    <rect x="10" y="85" width="44" height="155" rx="1" fill="none" stroke="#94A3B8" stroke-width="1" />

    <!-- Safety Orange Architectural Bands -->
    <rect x="10" y="85" width="44" height="5" fill="#F97316" />
    <rect x="10" y="235" width="44" height="5" fill="#F97316" />

    <!-- Swiss Grid Roof Ribs -->
    <g stroke="#CBD5E1" stroke-width="1.1">
      <line x1="10" y1="108" x2="54" y2="108" />
      <line x1="10" y1="126" x2="54" y2="126" />
      <line x1="10" y1="144" x2="54" y2="144" />
      <line x1="10" y1="162" x2="54" y2="162" />
      <line x1="10" y1="180" x2="54" y2="180" />
      <line x1="10" y1="198" x2="54" y2="198" />
      <line x1="10" y1="216" x2="54" y2="216" />
    </g>

    <!-- Center Spine Line -->
    <line x1="32" y1="90" x2="32" y2="235" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 5" />

    <!-- Corner Marker Lights -->
    <rect x="6.5" y="76" width="2.5" height="3" rx="0.5" fill="#F97316" />
    <rect x="55" y="76" width="2.5" height="3" rx="0.5" fill="#F97316" />
    <rect x="6.5" y="240" width="2.5" height="3" rx="0.5" fill="#EF4444" />
    <rect x="55" y="240" width="2.5" height="3" rx="0.5" fill="#EF4444" />

    <!-- Rear Underride Guard & Taillights -->
    <rect x="9" y="244" width="46" height="4" rx="1.2" fill="#334155" stroke="#0F172A" stroke-width="1.1" />
    <rect x="11" y="244.6" width="8" height="2.6" rx="0.8" fill="#EF4444" />
    <rect x="45" y="244.6" width="8" height="2.6" rx="0.8" fill="#EF4444" />
  </g>
</svg>
