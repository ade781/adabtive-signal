<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 118" width="48" height="118" fill="none">
  <!-- Side Mirrors -->
  <rect x="1.2" y="33" width="3.8" height="7.5" rx="1.5" fill="#475569" stroke="#334155" stroke-width="0.9"/>
  <rect x="43" y="33" width="3.8" height="7.5" rx="1.5" fill="#475569" stroke="#334155" stroke-width="0.9"/>

  <!-- Main Chassis -->
  <rect x="4.5" y="3" width="39" height="112" rx="8" fill="#475569" stroke="#334155" stroke-width="1.1"/>

  <!-- Subtle Hood Lines -->
  <path d="M11 9.5 L12.5 25 M37 9.5 L35.5 25" stroke="#64748B" stroke-width="0.85" stroke-linecap="round"/>

  <!-- Windshield -->
  <path d="M9.5 27 C16 25 32 25 38.5 27 L40.5 43 C32 41.5 16 41.5 7.5 43 Z" fill="#0F172A" stroke="#334155" stroke-width="0.75"/>
  <path d="M12 29 L16.5 28.2 L14 40 L10 40.5 Z" fill="#475569" opacity="0.4"/>

  <!-- Side Windows (Extended SUV Profile) -->
  <path d="M7 45 L8.8 46 L8.8 92 L7 93.5 Z" fill="#0F172A"/>
  <path d="M41 45 L39.2 46 L39.2 92 L41 93.5 Z" fill="#0F172A"/>

  <!-- Roof Panel -->
  <rect x="9.5" y="44" width="29" height="49" rx="3" fill="#526277" stroke="#334155" stroke-width="0.8"/>

  <!-- Roof Rails -->
  <rect x="11" y="46" width="2.2" height="45" rx="1" fill="#CBD5E1" stroke="#334155" stroke-width="0.6"/>
  <rect x="34.8" y="46" width="2.2" height="45" rx="1" fill="#CBD5E1" stroke="#334155" stroke-width="0.6"/>
  <!-- Crossbars -->
  <rect x="12" y="57" width="24" height="1.6" rx="0.5" fill="#94A3B8"/>
  <rect x="12" y="81" width="24" height="1.6" rx="0.5" fill="#94A3B8"/>

  <!-- Rear Window -->
  <path d="M9 95 C16 94 32 94 39 95 L37.5 106 C30 107.2 18 107.2 10.5 106 Z" fill="#0F172A" stroke="#334155" stroke-width="0.75"/>

  <!-- Headlights (Front / North) -->
