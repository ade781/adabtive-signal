  <path d="M40.5 6.5 C39 4.5 35.5 4 32.2 4.2 L32.8 7 L39.5 7.5 Z" fill="#F8FAFC"/>

  <!-- Taillights (Rear / South) -->
  <rect x="7.5" y="110.5" width="8.5" height="2.8" rx="1" fill="#EF4444"/>
  <rect x="32" y="110.5" width="8.5" height="2.8" rx="1" fill="#EF4444"/>
