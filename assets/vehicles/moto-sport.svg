<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 80" width="32" height="80" fill="none">
  <defs>
    <filter id="shadow-sport" x="-25%" y="-10%" width="150%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow-sport)">
    <!-- Front & Wider Rear Sport Tires -->
    <rect x="13.75" y="5" width="4.5" height="13" rx="2.25" fill="#0F172A"/>
    <rect x="13.25" y="61" width="5.5" height="14" rx="2.5" fill="#0F172A"/>

    <!-- Angular Sport Nose Fairing -->
    <path d="M16 6.5 L21.5 16 L22.5 26 L9.5 26 L10.5 16 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- Dual Angular Headlights -->
    <path d="M12.2 13 L15 11.5 L14.5 13.5 Z" fill="#BAE6FD"/>
    <path d="M19.8 13 L17 11.5 L17.5 13.5 Z" fill="#BAE6FD"/>
    <!-- Windscreen -->
    <path d="M13 15.5 L16 14 L19 15.5 L18.2 21 L13.8 21 Z" fill="#0F172A" opacity="0.85"/>
    <!-- Emerald Center Nose Accent -->
    <line x1="16" y1="8.5" x2="16" y2="14" stroke="#10B981" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Clip-on Swept-Back Handlebars & Bar-End Mirrors -->
    <path d="M6.5 23.5 L11.5 20.5" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M25.5 23.5 L20.5 20.5" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="5" y="22.4" width="3" height="2" rx="0.9" transform="rotate(-30 6.5 23.4)" fill="#0F172A"/>
    <rect x="24" y="22.4" width="3" height="2" rx="0.9" transform="rotate(30 25.5 23.4)" fill="#0F172A"/>

    <!-- Sculpted Sport Fuel Tank -->
    <path d="M10.5 24 C10.5 21.5, 21.5 21.5, 21.5 24 L20 35 C20 37, 12 37, 12 35 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.1"/>
    <path d="M12.5 24.5 L14 34" stroke="#10B981" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M19.5 24.5 L18 34" stroke="#10B981" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Sport Exhaust -->
    <rect x="20.2" y="47" width="2.2" height="15" rx="1.1" fill="#94A3B8" stroke="#0F172A" stroke-width="0.8"/>

    <!-- Tapered Rear Tail Cowl -->
    <path d="M11.5 46 L20.5 46 L18.5 64 L13.5 64 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="13" y="45" width="6" height="10" rx="2" fill="#1E293B"/>
    <!-- Twin Bar Taillight -->
    <rect x="13.5" y="62.5" width="2" height="1.5" rx="0.5" fill="#EF4444"/>
    <rect x="16.5" y="62.5" width="2" height="1.5" rx="0.5" fill="#EF4444"/>

    <!-- Rider Tucked Arms -->
    <path d="M10 33 L7.5 23" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 33 L24.5 23" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="7.2" cy="22.8" r="1.4" fill="#10B981"/>
    <circle cx="24.8" cy="22.8" r="1.4" fill="#10B981"/>

    <!-- Rider Aerodynamic Jacket -->
    <rect x="9" y="30.5" width="14" height="13" rx="5.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.1"/>
    <path d="M11.5 32 L11.5 41" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M20.5 32 L20.5 41" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rider Helmet (Tucked Forward) -->
    <circle cx="16" cy="33.5" r="5.3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M11.7 30.8 C13.2 28.8, 18.8 28.8, 20.3 30.8 L19.2 32.3 C17.8 31.3, 14.2 31.3, 12.8 32.3 Z" fill="#0F172A"/>
    <rect x="15.2" y="32.5" width="1.6" height="5.5" rx="0.8" fill="#10B981"/>
  </g>
</svg>
